name: Release

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write
  packages: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Python version
        run: |
          python --version
      - name: Install json5
        run: |
          pip install json5
      - name: Run zipmcproject.py
        run: |
          python zipmcproject.py
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mcpack"
